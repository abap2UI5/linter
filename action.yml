name: 'abap2UI5-linter'
description: 'Validate abap2UI5 app classes — the ABAP and the view it builds, checked together. No SAP system needed.'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  paths:
    description: 'Files or directories to check (space-separated). Unset: the repo''s abap2ui5lint.jsonc "paths", falling back to src'
    required: false
    default: ''
  min-ui5:
    description: 'UI5 floor for the property gate. Unset: the repo''s abap2ui5lint.jsonc, falling back to 1.71'
    required: false
    default: ''
  fail-on:
    description: 'Lowest severity that fails the job: error, warning, hint or never. Unset: the repo''s abap2ui5lint.jsonc, falling back to warning'
    required: false
    default: ''
  annotations:
    description: 'Annotate the findings on the pull request diff (GitHub workflow commands). Set to false to keep the log plain'
    required: false
    default: 'true'
  badge:
    description: 'Write the verdict badge ("check-abap2UI5 | 83 rules passed") to this path, e.g. .github/badges/check-abap2ui5.json. Unset: the repo''s abap2ui5lint.jsonc "badge", or no badge at all. Committing the file is the workflow''s job'
    required: false
    default: ''
  badge-corpus:
    description: 'Write the corpus badge ("abap2UI5 | 148 apps · 172 views · 2,176 controls") to this path, e.g. .github/badges/abap2ui5.json. Same rules as "badge"'
    required: false
    default: ''
  render:
    description: 'Run the render gate (a real XMLView.create in headless Chromium). On by default - it finds defects no static rule can. Set to false for a much faster job: it skips the ~118 MB UI5 runtime and the Chromium download, and every property-gate rule still runs'
    required: false
    default: 'true'
  screenshots:
    description: 'Also photograph every checked view into this directory (e.g. build/screenshots), for the workflow to upload as an artifact or post on the pull request. Runs after the check whether it passed or failed - a picture of what broke is worth more than one of what did not. Needs the render gate; skipped with a warning when render is false'
    required: false
    default: ''
  screenshot-size:
    description: 'Viewport(s) for the screenshots, e.g. "390x844,1280x900" for a phone-and-desktop matrix. Unset: 1280x900'
    required: false
    default: ''
  screenshot-theme:
    description: 'UI5 theme for the screenshots, e.g. sap_horizon_dark. Unset: sap_horizon'
    required: false
    default: ''
  flags:
    description: 'Extra CLI flags, e.g. "--allow sap.m.Avatar.displaySize"'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    # The UI5 runtime is a WORKSPACE of this repository, not a dependency of the
    # linter itself, so `--workspaces=false` is what makes a property-only job
    # skip the ~118 MB download instead of paying it and then passing
    # --no-render. The full install stays the default: turning the render gate
    # off silently would make findings disappear from somebody's CI.
    - name: Install abap2UI5-linter (with the UI5 runtime)
      if: inputs.render != 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: npm ci --prefix "$ACTION_PATH"
    - name: Install abap2UI5-linter (property gate only)
      if: inputs.render == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: npm ci --prefix "$ACTION_PATH" --workspaces=false

    - name: Install Chromium
      if: inputs.render != 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: npx --prefix "$ACTION_PATH" playwright install chromium --with-deps
    - name: Run abap2UI5-linter
      shell: bash
      # Inputs reach the shell only through env - a `${{ }}` interpolated into
      # `run:` would let a crafted input inject shell commands. Only
      # explicitly-set inputs become flags, so the checked repo's
      # abap2ui5lint.jsonc governs everything left unset. Annotations are on
      # by default inside a workflow - that is what puts a finding on the diff
      env:
        ACTION_PATH: ${{ github.action_path }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_MIN_UI5: ${{ inputs['min-ui5'] }}
        LINT_FAIL_ON: ${{ inputs['fail-on'] }}
        LINT_ANNOTATIONS: ${{ inputs.annotations }}
        LINT_BADGE: ${{ inputs.badge }}
        LINT_BADGE_CORPUS: ${{ inputs['badge-corpus'] }}
        LINT_RENDER: ${{ inputs.render }}
        LINT_FLAGS: ${{ inputs.flags }}
      run: |
        ARGS=()
        if [ -n "$LINT_MIN_UI5" ]; then ARGS+=(--min-ui5 "$LINT_MIN_UI5"); fi
        # render: false skipped the runtime install above, so the gate has to be
        # switched off here too - otherwise the run dies naming the missing
        # runtime instead of reporting the property findings it can produce
        if [ "$LINT_RENDER" = "false" ]; then ARGS+=(--no-render); fi
        if [ -n "$LINT_FAIL_ON" ]; then ARGS+=(--fail-on "$LINT_FAIL_ON"); fi
        if [ "$LINT_ANNOTATIONS" = "false" ]; then ARGS+=(--no-annotate); fi
        # one path each, quoted - a badge file name is not a list, unlike paths/flags
        if [ -n "$LINT_BADGE" ]; then ARGS+=(--badge "$LINT_BADGE"); fi
        if [ -n "$LINT_BADGE_CORPUS" ]; then ARGS+=(--badge-corpus "$LINT_BADGE_CORPUS"); fi
        # paths and flags are documented as space-separated lists, so they are
        # split on whitespace DELIBERATELY - via read -a into argv words, which
        # word-splits without re-parsing quotes, globs or metacharacters
        read -r -a PATH_ARGS <<< "$LINT_PATHS"
        read -r -a FLAG_ARGS <<< "$LINT_FLAGS"
        node "$ACTION_PATH/cli.mjs" "${PATH_ARGS[@]}" "${ARGS[@]}" "${FLAG_ARGS[@]}"

    # Pictures of what the checked classes build - the review artefact CI could
    # never produce, because seeing an abap2UI5 view used to need a system.
    #
    # `always()` on purpose: the run that FAILED is the one where a reviewer
    # most wants to look at the view, and a step that only runs on green would
    # never produce that picture. The screenshot mode's own exit code is not
    # the job's either - a view that could not be photographed is a warning
    # here, not a second reason to fail a check that already had its say.
    - name: Screenshot the views
      if: ${{ always() && inputs.screenshots != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_RENDER: ${{ inputs.render }}
        SHOT_DIR: ${{ inputs.screenshots }}
        SHOT_SIZE: ${{ inputs['screenshot-size'] }}
        SHOT_THEME: ${{ inputs['screenshot-theme'] }}
      run: |
        if [ "$LINT_RENDER" = "false" ]; then
          echo "::warning::screenshots were requested but render is false - the UI5 runtime was never installed, so there is nothing to photograph with"
          exit 0
        fi
        SHOT_ARGS=(--screenshot "$SHOT_DIR/view.png")
        if [ -n "$SHOT_SIZE" ]; then SHOT_ARGS+=(--screenshot-size "$SHOT_SIZE"); fi
        if [ -n "$SHOT_THEME" ]; then SHOT_ARGS+=(--screenshot-theme "$SHOT_THEME"); fi
        read -r -a PATH_ARGS <<< "$LINT_PATHS"
        mkdir -p "$SHOT_DIR"
        if ! node "$ACTION_PATH/cli.mjs" "${PATH_ARGS[@]}" "${SHOT_ARGS[@]}"; then
          echo "::warning::no view could be photographed - see the log above"
        fi
