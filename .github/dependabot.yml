# Monthly dependency updates, opened as pull requests so `npm test` and the
# downstream workflow decide whether they are safe.
#
# Grouped one pull request per ecosystem. The runtime dependency count of
# @abap2ui5/linter is zero and is meant to stay zero; everything here is
# build- and test-time, plus the @openui5/* packages the render-runtime
# workspace serves - and those move the metadata snapshot, which
# `generate-metadata --check` gates.
#
# The actions are pinned by commit SHA. Dependabot moves the SHA and keeps
# the version comment beside it.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      # The @openui5 pins get a group of their own because they are not a
      # dependency bump, they are a KNOWLEDGE bump: moving them makes
      # data/properties.json and data/icons.json stale, which `npm test` fails
      # on by design. `dependabot-openui5.yml` regenerates both onto the branch,
      # and that self-heal only produces a coherent diff when the pull request
      # carries the pins and nothing else. Listed FIRST: a dependency joins the
      # first group it matches.
      openui5:
        patterns: ["@openui5/*"]
      toolchain:
        patterns: ["*"]
        exclude-patterns: ["@openui5/*"]
        update-types: ["minor", "patch"]
      toolchain-major:
        patterns: ["*"]
        exclude-patterns: ["@openui5/*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
