name: CI
on:
  push:
  pull_request:

# It installs, tests and renders; nothing is written back. Without this block
# the run gets the repository default, which is read/write in plenty of
# organisations - and this repository publishes to npm, so a token wider than
# the job needs is worth removing even from the job that does not publish.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Chromium download is the slow half of the install; cache it keyed
      # on the lockfile (which pins the playwright version). On a hit,
      # `playwright install` finds the browser and only installs system deps
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      # npm test includes the metadata drift gate (generate-metadata --check):
      # ~2s since the extend-scan fix, so it no longer needs its own step
      - run: npm test
