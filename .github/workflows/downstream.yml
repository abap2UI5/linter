name: Downstream

# The linter was extracted from samples-controls' CI gates and is consumed
# back by it, so `npm test` here only ever proves the linter against its own
# fixtures.
# This workflow closes that loop: every change is run against the real
# consumers, with THIS checkout substituted for the version they pin.
#
# Why substitution and not a plain `npm ci`: both pinning consumers install a
# FIXED linter - samples-controls a published npm version through its
# package-lock.json (a caret range on the current minor, raised weekly by its bump_linter
# workflow; substitute-linter.sh prints whether that range still admits this version),
# the VS Code extension a commit SHA - which is exactly what makes them stable,
# and exactly what would make this job test the pinned version instead of the
# proposed one. So the consumer is installed normally (to get the hoisted
# @openui5 + playwright tree) and only the linter's own published files are
# swapped in afterwards. The third consumer, mcp-server, pins nothing: it imports
# the sibling checkout, so it is simply given this one.
#
# A failure here is not automatically a defect in the change: a new rule that
# fires on the corpus may well be right. It means the rollout has to be
# decided - severity, an advisory period, or a corpus fix - instead of landing
# unseen and breaking a downstream repo on its next update.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples-controls:
    # The corpus: every generated port in samples-controls (its STATUS.md has
    # the current count - a number written here would go stale weekly). Runs the
    # consumer's own gate wrapper (view-gates.mjs), so the corpus POLICY applies
    # - POST_171 deviations,
    # declared render skips, advisory rules - and a failure means a real port
    # regressed, not that a deviation went unread.
    name: samples-controls corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the linter (this change)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linter

      - name: Check out samples-controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples-controls
          path: samples-controls

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples-controls/package-lock.json

      - name: Install samples-controls (with its pinned linter)
        working-directory: samples-controls
        run: npm ci

      - name: Substitute this checkout for the pinned linter
        run: ./linter/.github/scripts/substitute-linter.sh linter samples-controls

      # cache the Chromium download, keyed on the consumer's lockfile (which
      # pins its playwright version); a hit skips the download, not the deps
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('samples-controls/package-lock.json') }}

      - run: npx playwright install chromium --with-deps
        working-directory: samples-controls

      - name: View gates over every port
        working-directory: samples-controls
        run: node scripts/view-gates.mjs --strict

  mcp-server:
    # The third consumer does not pin at all: the MCP server imports whatever
    # linter checkout sits next to it, through the package exports map, and
    # its own CI has no linter. Running its test suite with THIS checkout as
    # the sibling is the only automated guard on that edge - it catches a
    # removed export subpath or a changed result shape before it lands in
    # every developer's editor session.
    name: mcp-server smoke (unpinned consumer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the linter (this change)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linter

      - name: Check out mcp-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/mcp-server
          path: mcp-server

      - name: Check out samples-controls (the server's content source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples-controls
          path: samples-controls

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install mcp-server
        working-directory: mcp-server
        run: npm ci

      - name: Test suite with this linter as the sibling checkout
        working-directory: mcp-server
        run: npm test

  vscode-extension:
    # The other consumer imports the library through its subpath exports
    # (./reconstruct, ./properties, ./abap-rules, ./findings) against the
    # typings THIS repo ships (types.d.ts, per subpath in the exports map) -
    # the extension dropped its hand-written copy. Type-checking it against
    # this checkout is what catches a renamed export, a changed finding shape
    # or a types.d.ts that no longer matches the code - the corpus job never
    # would, because view-gates uses a different subset.
    name: vscode-extension typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the linter (this change)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linter

      - name: Check out the extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/vscode-extension
          path: vscode-extension

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install the extension (with its pinned linter)
        working-directory: vscode-extension
        run: npm ci

      - name: Substitute this checkout for the pinned linter
        run: ./linter/.github/scripts/substitute-linter.sh linter vscode-extension

      - name: Type-check against this linter
        working-directory: vscode-extension
        run: npm run lint

      - name: Bundle
        working-directory: vscode-extension
        run: npm run compile

  # The two consumers with no gate wrapper of their own: they run this linter
  # straight, so what they measure is the RULE SET on real app code rather
  # than a corpus policy's verdict on it. Property gate only (--no-render):
  # minutes of CI instead of a Chromium download each, and every property rule
  # still runs. They are also where the rollout numbers in AGENTS.md come
  # from - a finding count printed by a job beats one measured by hand once.
  app-corpora:
    name: ${{ matrix.repo }} property gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: abap2UI5/samples
            paths: src
          - repo: abap2UI5/app-template
            paths: src
    steps:
      - name: Check out the linter (this change)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linter

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: consumer

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No install and no substitution: these repos run the linter as a tool,
      # not as a library, so the checkout IS the linter under test. Their own
      # abap2ui5lint.jsonc is discovered from the checked path, so the run
      # applies the settings the repo actually committed.
      - name: Property gate over ${{ matrix.repo }}
        working-directory: consumer
        env:
          LINT_PATHS: ${{ matrix.paths }}
        run: |
          read -r -a PATH_ARGS <<< "$LINT_PATHS"
          node ../linter/cli.mjs "${PATH_ARGS[@]}" --no-render --advisory \
            --json-out "$RUNNER_TEMP/report.json"

      # --advisory above, so the step reports rather than gates: a new rule
      # firing on a real corpus is a rollout decision, not automatically a
      # defect (the same doctrine the samples-controls job runs on). What the
      # job is FOR is the number, so the number is what it prints.
      - name: Findings on ${{ matrix.repo }}
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/report.json", "utf8"));
            const by = {};
            for (const f of r.results.flatMap((x) => x.findings)) by[f.type] = (by[f.type] || 0) + 1;
            const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
            const lines = [
              `## ${process.env.REPO} — property gate`,
              "",
              `${r.files} file(s), ${r.problems} finding(s): ${r.totals.error} error, ${r.totals.warning} warning, ${r.totals.hint} hint`,
              "",
              "| Rule | Findings |", "| --- | ---: |",
              ...rows.map(([t, n]) => `| \`${t}\` | ${n} |`),
            ].join("\n");
            console.log(lines);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines + "\n");
          '
        env:
          REPO: ${{ matrix.repo }}
