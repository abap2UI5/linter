name: Render-gate bundle
# Maintains the rolling release `render-gate-bundle`: a self-contained
# tarball of the checker (CLI + lib + data + production node_modules,
# pure JS - no native modules, so one bundle serves every OS). The
# abap2UI5 VS Code extension downloads this asset to install the render
# gate with VS Code's own Node.js; Chromium is fetched separately via
# playwright's CLI at install time.
on:
  push:
    branches: [main]
    paths:
      - cli.mjs
      - lib/**
      - data/**
      - package.json
      - package-lock.json
      - .github/workflows/bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The UI5 runtime lives in the render-runtime WORKSPACE, so it arrives as
      # ordinary (non-dev) dependencies of that workspace and `--omit=dev` keeps
      # it - which is what makes this bundle a render gate at all.
      - run: npm ci --omit=dev
      # render-runtime/ ships next to node_modules on purpose: npm links the
      # workspace as node_modules/@abap2ui5/render-runtime -> ../../render-runtime,
      # and without the target that symlink dangles in the extracted bundle. The
      # linter would fall back to the hoisted @openui5 tree anyway, but shipping
      # the manifest keeps resolution on the intended path.
      - run: tar czf view-check-bundle.tgz cli.mjs lib data node_modules package.json render-runtime
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: render-gate-bundle
          name: Render-gate bundle (rolling)
          body: >
            Self-contained checker bundle (CLI + runtime dependencies) rebuilt
            automatically from main. Consumed by the abap2UI5 VS Code
            extension's "Install Render Gate" command - not meant for manual
            installation; see the README for the CLI setup.
          prerelease: true
          make_latest: false
          files: view-check-bundle.tgz
      # The same bundle once more under an immutable per-commit tag. The
      # extension prefers the tag matching its pinned linter commit (so an
      # installed release runs the exact linter state it was tested with) and
      # falls back to the rolling tag when no per-commit bundle exists. Also
      # the audit/rollback handle the rolling tag cannot provide.
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: render-gate-bundle-${{ steps.sha.outputs.short }}
          name: Render-gate bundle @ ${{ steps.sha.outputs.short }}
          body: >
            Immutable render-gate bundle built from commit ${{ github.sha }}.
            Preferred by VS Code extension builds pinning this linter commit;
            the rolling `render-gate-bundle` release always carries the
            newest build.
          prerelease: true
          make_latest: false
          files: view-check-bundle.tgz
