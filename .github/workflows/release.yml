name: Publish to npm
# Publishes TWO packages to the public npm registry from one version tag:
#
#   @abap2ui5/linter           the CLI, the library and the GitHub Action
#   @abap2ui5/render-runtime   the UI5 runtime the render gate serves
#
# They are one release with one version. The runtime exists so that a default
# `npm i @abap2ui5/linter` (and `npx`, which has no --omit=optional) stays at
# ~240 kB instead of dragging ~123 MB of @openui5 in; splitting it out is only
# safe if the two never drift, because the linter's metadata snapshot is
# generated from exactly the @openui5 version pinned over there.
#
# Merging to main stays a release for every OTHER consumer (the rules page,
# the render-gate bundle, the SHA pins downstream) - npm is the one channel
# that needs a deliberate, immutable version, because a published version can
# never be changed and `npm i @abap2ui5/linter` has to keep meaning one thing.
#
# To cut a release (--no-git-tag-version because npm would otherwise commit and
# tag the root alone, leaving the workspace bump out of the tagged commit):
#   npm version patch|minor|major --workspaces --include-workspace-root --no-git-tag-version
#   git commit -am "release vX.Y.Z" && git tag -a vX.Y.Z -m "release vX.Y.Z"
#   git push --follow-tags && git push origin vX.Y.Z
# Both versions must match the tag; the job refuses to publish when they do not.
#
# The -a is not decoration and the second push is not redundant:
# `--follow-tags` pushes ANNOTATED tags only and skips a lightweight one
# WITHOUT A WORD - `git tag vX.Y.Z` (no -a) plus `git push --follow-tags`
# reports "main -> main", leaves the release commit on main with no tag
# behind it, and nothing here ever runs. The explicit tag push makes the
# release independent of which kind of tag was cut.
#
# ---------------------------------------------------------------------------
# One-time setup, in this order - the workflow cannot do either step itself:
#
#   1. The npm organisation `abap2ui5` has to exist and own the scope
#      (npmjs.com -> Add Organization, free for public packages). Until then
#      every publish fails with 404 on the scope.
#   2. Trusted publishing has to be configured per package, and npm can only
#      configure it for a package that already exists. So the FIRST publish of
#      EACH is manual, from a maintainer's machine, after `npm login`:
#
#         npm publish -w @abap2ui5/render-runtime --access public
#         npm publish --access public
#
#      No --provenance on these two: npm can only generate a provenance
#      attestation from a supported CI (GitHub Actions or GitLab CI) and
#      aborts everywhere else with "Automatic provenance generation not
#      supported for provider". The bootstrap versions therefore ship
#      without provenance - every release this workflow cuts has it.
#
#      Then, on npmjs.com -> each package -> Settings -> Trusted Publisher,
#      point it at this repository and this workflow file (`release.yml`).
#      From the second release on, this workflow publishes with no token.
#
# Trusted publishing (OIDC) is deliberate: no NPM_TOKEN secret to leak or
# rotate, and npm records a provenance attestation tying the tarball to this
# workflow run and commit. `id-token: write` below is what mints that token.
# ---------------------------------------------------------------------------
on:
  push:
    tags:
      # Version tags only, NOT the bare major alias this workflow maintains.
      # `v*` also matched `v0`, so moving that alias by hand started a release
      # run for it - one that can only fail, because the version check compares
      # the tag against package.json and `v0` is not a version. A red run for a
      # correct action is worse than no run.
      - 'v*.*.*'
  # A publish is irreversible, so it is worth being able to run everything
  # EXCEPT the publish. Dispatching this workflow does exactly that: the same
  # gates, the same tarball, no registry write.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, which has no OIDC support at all - it would
      # fall through to asking for a token and fail confusingly. Trusted
      # publishing needs 11.5.1 or newer.
      - name: Use an npm that can publish via OIDC
        run: npm install -g npm@latest

      - run: npm ci

      # The tag is the version claim; package.json is what actually gets
      # published. Catching a mismatch here costs a minute, catching it after
      # the fact costs a burned version number - npm never lets one be reused.
      - name: Tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($PKG)" >&2
            exit 1
          fi
          # The runtime is published from this same tag and is named as the
          # linter's peer by an exact minor range, so a version that lags here
          # publishes a pair that cannot be installed together.
          RT="v$(node -p "require('./render-runtime/package.json').version")"
          if [ "$RT" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match render-runtime/package.json ($RT)" >&2
            echo "bump both: npm version <level> --workspaces --include-workspace-root" >&2
            exit 1
          fi
          echo "publishing $PKG"

      # Same gate as ci.yml, on the exact commit being published rather than
      # on whatever passed on main - the render half of the suite needs the
      # browser, so a published version is one that rendered.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm test

      # Build the tarball first and print what is in it. `files` in
      # package.json is an allowlist, so the failure mode is a lib/ or data/
      # file silently missing from the published package while every local
      # test passes against the working tree.
      # Both packages, so the contents of each are on the log. `files` in
      # package.json is an allowlist, so the failure mode is a lib/ or data/
      # file silently missing from the published package while every local
      # test passes against the working tree.
      - name: Pack and show the contents
        run: |
          npm pack
          npm pack -w @abap2ui5/render-runtime

      # Prove the packed artefact works the way a consumer meets it: installed
      # from a tarball, in a directory that is not this repo - and with a PLAIN
      # install, because that is what `npx` does and what a first-time user gets.
      - name: Smoke-test the tarball as an installed package
        run: |
          TARBALL="$PWD/$(ls abap2ui5-linter-*.tgz)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$TARBALL"

          # The reason the UI5 runtime is a separate package at all: npm installs
          # optionalDependencies BY DEFAULT, so declaring @openui5 that way made
          # `npx @abap2ui5/linter` a ~123 MB download before it linted anything.
          # If this ever finds them again, that regression is back.
          if [ -d node_modules/@openui5 ]; then
            echo "::error::the default install pulled the UI5 runtime - the render deps must stay an optional PEER" >&2
            exit 1
          fi

          npx abap2ui5lint --version
          node -e "import('@abap2ui5/linter').then(m => {
            for (const fn of ['checkFiles', 'checkAbapSource', 'checkXmlSource'])
              if (typeof m[fn] !== 'function') throw new Error('missing export: ' + fn);
          })"
          node -e "import('@abap2ui5/linter/config').then(m => {
            if (typeof m.loadConfig !== 'function') throw new Error('missing config export');
          })"

      # A version that is already on the registry is not a failure here. Two
      # ordinary situations produce one: the BOOTSTRAP release of each package
      # is published by hand (trusted publishing cannot be configured for a
      # package that does not exist yet - see the header), and a workflow re-run
      # repeats a publish that already succeeded. npm never lets a version be
      # replaced, so "already there" is the desired end state, not an error -
      # and the job must still reach `after-publish`, which is what makes
      # `uses: abap2UI5/linter@v0` resolve and writes the release notes.
      - name: Which versions are already on the registry
        id: published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The notice is printed HERE rather than inside the function, because
          # a function whose result is read through $(...) may write nothing but
          # that result: the notice would be captured with it and land in
          # GITHUB_OUTPUT as a second line, which fails the step with
          # "Invalid format" - and takes `after-publish` down with it, exactly in
          # the already-published case this step exists to survive.
          VERSION="${GITHUB_REF_NAME#v}"
          for PAIR in 'runtime:@abap2ui5/render-runtime' 'linter:@abap2ui5/linter'; do
            KEY="${PAIR%%:*}"
            PKG="${PAIR#*:}"
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG@$VERSION is already published - skipping its publish step"
              echo "$KEY=true" >> "$GITHUB_OUTPUT"
            else
              echo "$KEY=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # --access public because a scoped package is private by default and the
      # first publish would fail on a free account. No NODE_AUTH_TOKEN: npm
      # exchanges the Actions OIDC token for a short-lived registry credential
      # and attaches provenance on its own.
      #
      # The runtime goes FIRST: it is what the linter names as its optional
      # peer, so publishing it second would leave a window in which `npm i
      # @abap2ui5/linter @abap2ui5/render-runtime` cannot be satisfied.
      - name: Publish the UI5 runtime
        if: startsWith(github.ref, 'refs/tags/') && steps.published.outputs.runtime != 'true'
        run: npm publish -w @abap2ui5/render-runtime --access public
      - name: Publish the linter
        if: startsWith(github.ref, 'refs/tags/') && steps.published.outputs.linter != 'true'
        run: npm publish --access public

      - name: Dry run only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Not a tag - everything ran except the publish."

  # The same tag serves the OTHER consumer of a release: the GitHub Action in
  # this repo. Action users pin `uses: abap2UI5/linter@v0`, so the major tag
  # has to be moved onto every release - that is the Actions convention, and
  # it is what replaces the unpinnable `@main` the README used to document.
  #
  # Force-moving a tag is normally a smell; for a major Action tag it is the
  # documented practice. Only the ALIAS moves - `v0.1.0` stays where it is, so
  # a consumer who wants an immutable pin already has one.
  #
  # Separate job so the publish keeps `contents: read`: only this one needs
  # write, and it needs no OIDC token at all.
  #
  # Named for when it runs rather than for what it does, because it does two
  # things now: move the major alias, and write the GitHub Release.
  after-publish:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # CHANGELOG.md, at the tag - the release notes are read out of it below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Moved through the git REFS API, not `git push -f`. A push is refused
      # outright when the ref it moves carries workflow-file changes:
      #
      #   ! [remote rejected] v0 -> v0 (refusing to allow a GitHub App to
      #     create or update workflow `.github/workflows/release.yml`
      #     without `workflows` permission)
      #
      # and that permission does not exist for GITHUB_TOKEN - it cannot be
      # granted in the permissions block above, only to a GitHub App or a PAT.
      # So any release that touched this file could never move its own major
      # tag, which is every release that changes how releases work. Updating
      # the ref is a pointer write: no blob is created, so the workflow-file
      # check does not apply.
      #
      # A failure here leaves the PUBLISH intact - the packages are already on
      # npm by now - and only the `v0` alias stale, so the message says what to
      # run by hand rather than pretending the release did not happen.
      - name: Move the major tag onto this release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const major = tag.split('.')[0];        // v0.1.0 -> v0, v1.4.2 -> v1
            if (major === tag) {
              core.info(`${tag} is already a bare major tag - nothing to move`);
              return;
            }
            const ref = `tags/${major}`;
            try {
              await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
            } catch (e) {
              if (e.status !== 422) throw e;        // 422 = the tag does not exist yet
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
            }
            core.info(`${major} now points at ${tag} (${context.sha})`);
          # Fail loudly rather than leave a silently stale alias: an Action
          # user pinning @v0 would otherwise keep getting the old release.

      # The tag's THIRD consumer: a human on the releases page.
      #
      # Until 2026-08-18 this workflow made none, and nobody noticed for five
      # releases - `releases/latest` answered 404, the repository showed no
      # Latest badge, and the page was 37 rolling `render-gate-bundle`
      # prereleases with no version among them. The five were written by hand
      # afterwards; this is so there is no sixth.
      #
      # After the alias step, and `!cancelled()` so the order cannot cost
      # anything: a failure here must not skip the alias move (that one leaves
      # consumers on old code), and a failed alias move must not skip this.
      - name: Write the GitHub release
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              core.info(`${tag} is not a version tag - no release to write`);
              return;
            }
            const version = tag.slice(1);

            // The notes are the CHANGELOG section for this version, which
            // RELEASING.md step 2 renames from "Unreleased" in the release
            // commit. Heading shapes seen in this file: `## 0.2.1` and
            // `## 0.2.2 - 2026-08-18`, so match the version then a space or
            // the end of the line - `## 0.2.1` must not match `## 0.2.10`.
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
            const heading = new RegExp('^## ' + version.replace(/\./g, '\\.') + '( |$)');
            const from = lines.findIndex((l) => heading.test(l));
            let body;
            if (from === -1) {
              // A warning, not a failure. The packages are on npm by now, and
              // notes that are missing are visible on the page and editable in
              // a minute - unlike a stale alias, which is silent and serves
              // the wrong code. A red run for something cosmetic is how people
              // learn to ignore red release runs.
              core.warning(
                `CHANGELOG.md has no "## ${version}" section, so the release points at the file instead of quoting it. `
                + 'RELEASING.md step 2 is where that heading gets renamed - add the notes on the release page.',
              );
              body = `See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${tag}/CHANGELOG.md).`;
            } else {
              let to = from + 1;
              while (to < lines.length && !/^## /.test(lines[to])) to += 1;
              body = lines.slice(from + 1, to).join('\n').trim();
            }

            // `make_latest` is decided here rather than left at 'true',
            // because a patch backported to an older line (v0.1.3 after
            // v0.2.0) is a release but not the latest one, and marking it so
            // would point every reader at the older code.
            const parts = (t) => t.slice(1).split('.').map(Number);
            const newer = (a, b) => {
              for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] > b[i];
              return false;
            };
            const mine = parts(tag);
            const { data: existing } = await github.rest.repos.listReleases({ ...context.repo, per_page: 100 });
            const outranked = existing
              .filter((r) => !r.prerelease && !r.draft && /^v\d+\.\d+\.\d+$/.test(r.tag_name))
              .some((r) => newer(parts(r.tag_name), mine));
            const make_latest = outranked ? 'false' : 'true';

            try {
              const { data } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: tag,
                body,
                draft: false,
                prerelease: false,
                make_latest,
              });
              core.info(`${data.html_url} (make_latest=${make_latest})`);
            } catch (e) {
              if (e.status !== 422) throw e;
              // Same doctrine as the publish step: a re-run finds the work
              // done and moves on. Left untouched rather than rewritten,
              // because notes edited by hand on the page would be the thing
              // an update destroyed.
              core.info(`${tag} already has a release - left as it is`);
            }
